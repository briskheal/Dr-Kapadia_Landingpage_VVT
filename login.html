<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Dr. Kapadia Digital Brain</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #CE176B;
            --secondary: #014A81;
            --bg: #F8FAFC;
        }
        body { font-family: 'Outfit', sans-serif; background: var(--bg); display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .login-card { background: white; padding: 40px; border-radius: 30px; box-shadow: 0 20px 50px rgba(0,0,0,0.05); width: 100%; max-width: 400px; text-align: center; }
        .login-card h2 { color: var(--secondary); margin-bottom: 30px; }
        .form-group { text-align: left; margin-bottom: 20px; }
        .form-group label { display: block; font-size: 0.8rem; font-weight: 700; color: var(--secondary); opacity: 0.6; margin-bottom: 8px; }
        .form-control { width: 100%; padding: 15px; border-radius: 12px; border: 1px solid #E2E8F0; font-family: inherit; font-size: 1rem; box-sizing: border-box; }
        .btn { width: 100%; padding: 16px; border-radius: 15px; background: var(--primary); color: white; border: none; font-weight: 700; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        .btn:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(206, 23, 107, 0.2); }
        .error { color: #EF4444; font-size: 0.85rem; margin-top: 15px; display: none; }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>Digital Brain Login</h2>
        <div class="form-group">
            <label>LOGIN ID</label>
            <input type="text" id="loginId" class="form-control" placeholder="Enter ID">
        </div>
        <div class="form-group">
            <label>PASSWORD</label>
            <input type="password" id="password" class="form-control" placeholder="••••••••">
        </div>
        <button class="btn" onclick="handleLogin()">Sign In</button>
        <div id="errorMessage" class="error">Invalid Credentials</div>
    </div>

    <script>
        async function handleLogin() {
            const loginId = document.getElementById('loginId').value;
            const password = document.getElementById('password').value;
            const error = document.getElementById('errorMessage');

            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ loginId, password })
            });

            const data = await res.json();
            if (data.success) {
                localStorage.setItem('adminToken', data.token);
                window.location.href = data.redirect;
            } else {
                error.style.display = 'block';
            }
        }
    </script>
</body>
</html>
