<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal | Dr. Kapadia Digital Brain</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #CE176B;
            --secondary: #014A81;
            --accent: #00ADEF;
            --bg: #F8FAFC;
            --card-bg: #FFFFFF;
            --text: #1E293B;
            --border: #E2E8F0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Outfit', sans-serif; background: var(--bg); color: var(--text); padding-bottom: 80px; }

        /* Header */
        .admin-header { background: var(--secondary); color: white; padding: 20px; position: sticky; top: 0; z-index: 100; display: flex; justify-content: space-between; align-items: center; }
        .admin-header h1 { font-size: 1.2rem; font-weight: 700; }

        /* Container */
        .container { max-width: 800px; margin: 20px auto; padding: 0 20px; }

        /* Card Style */
        .admin-card { background: var(--card-bg); border-radius: 20px; padding: 25px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); margin-bottom: 25px; border: 1px solid var(--border); }
        .admin-card h2 { font-size: 1.1rem; margin-bottom: 20px; color: var(--secondary); display: flex; align-items: center; gap: 10px; }

        /* Forms */
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 0.85rem; font-weight: 700; margin-bottom: 8px; color: var(--text); opacity: 0.7; }
        .form-control { width: 100%; padding: 14px; border-radius: 12px; border: 1px solid var(--border); font-family: 'Outfit', sans-serif; font-size: 1rem; transition: 0.3s; }
        .form-control:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px rgba(0, 173, 239, 0.1); }

        /* Upload Placeholder */
        .upload-zone { border: 2px dashed var(--border); border-radius: 15px; padding: 30px; text-align: center; cursor: pointer; transition: 0.3s; background: var(--bg); }
        .upload-zone:hover { border-color: var(--accent); background: #F0F9FF; }
        .upload-zone i { font-size: 2rem; color: var(--text); opacity: 0.3; margin-bottom: 10px; }
        .upload-zone p { font-size: 0.9rem; font-weight: 600; opacity: 0.6; }

        /* Photo Grid */
        .photo-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 15px; }
        .photo-item { aspect-ratio: 1; border-radius: 10px; background: #eee; position: relative; overflow: hidden; }
        .photo-item img { width: 100%; height: 100%; object-fit: cover; }
        .remove-btn { position: absolute; top: 5px; right: 5px; background: rgba(239, 68, 68, 0.9); color: white; border: none; width: 24px; height: 24px; border-radius: 50%; cursor: pointer; font-size: 0.7rem; }

        /* Action Bar */
        .save-bar { position: fixed; bottom: 0; left: 0; right: 0; background: white; padding: 15px 20px; border-top: 1px solid var(--border); display: flex; gap: 15px; box-shadow: 0 -10px 30px rgba(0,0,0,0.05); }
        .btn { flex: 1; padding: 16px; border-radius: 15px; font-weight: 700; border: none; cursor: pointer; font-family: 'Outfit', sans-serif; transition: 0.3s; }
        .btn-save { background: var(--primary); color: white; }
        .btn-preview { background: var(--bg); color: var(--secondary); border: 1px solid var(--border); }

        /* Mobile Tab Bar */
        @media (max-width: 600px) {
            .admin-header { padding: 15px 20px; }
            .save-bar { bottom: 0; z-index: 200; }
        }
    </style>
</head>
<body>

    <div class="admin-header">
        <h1>Admin Portal</h1>
        <div style="font-size: 0.8rem; font-weight: 700; background: rgba(255,255,255,0.1); padding: 5px 12px; border-radius: 50px;">Live Sync: ON</div>
    </div>

    <div class="container">
        <!-- Section: Org Details -->
        <div class="admin-card">
            <h2><i class="fas fa-building"></i> Organization Details</h2>
            <div class="form-group">
                <label>CLINIC NAME</label>
                <input type="text" class="form-control" value="Dr. Sumit Kapadia - Vascular Specialist">
            </div>
            <div class="form-group">
                <label>HOSPITAL AFFILIATION</label>
                <input type="text" class="form-control" value="Aadicura Hospital, Vadodara">
            </div>
            <div class="form-group">
                <label>CONTACT PHONE</label>
                <input type="text" class="form-control" value="+91 72010 14017">
            </div>
        </div>

        <!-- Section: Branding -->
        <div class="admin-card">
            <h2><i class="fas fa-image"></i> Branding Images</h2>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                <div class="form-group">
                    <label>CLINIC LOGO</label>
                    <div class="upload-zone">
                        <i class="fas fa-cloud-upload-alt"></i>
                        <p>Logo</p>
                    </div>
                </div>
                <div class="form-group">
                    <label>DR. KAPADIA PHOTO</label>
                    <div class="upload-zone">
                        <i class="fas fa-user-md"></i>
                        <p>Photo</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Section: Photo Gallery -->
        <div class="admin-card">
            <h2><i class="fas fa-images"></i> Photograph Gallery</h2>
            <p style="font-size: 0.8rem; color: var(--text); opacity: 0.6; margin-bottom: 15px;">Photos here will auto-scroll on the landing page.</p>
            <div class="upload-zone">
                <i class="fas fa-plus-circle"></i>
                <p>Add New Photographs</p>
            </div>
            <div class="photo-grid">
                <div class="photo-item">
                    <img src="clinic.png" alt="Clinic">
                    <button class="remove-btn"><i class="fas fa-times"></i></button>
                </div>
                <div class="photo-item">
                    <img src="https://via.placeholder.com/150" alt="Gallery">
                    <button class="remove-btn"><i class="fas fa-times"></i></button>
                </div>
                <div class="photo-item">
                    <img src="https://via.placeholder.com/150" alt="Gallery">
                    <button class="remove-btn"><i class="fas fa-times"></i></button>
                </div>
            </div>
        </div>

        <!-- Section: Video Links -->
        <div class="admin-card">
            <h2><i class="fas fa-video"></i> Video Uploads</h2>
            <div class="form-group">
                <label>YOUTUBE VIDEO LINK 1</label>
                <input type="text" class="form-control" placeholder="https://youtube.com/watch?v=...">
            </div>
            <div class="form-group">
                <label>YOUTUBE VIDEO LINK 2</label>
                <input type="text" class="form-control" placeholder="https://youtube.com/watch?v=...">
            </div>
            <button class="btn btn-preview" style="width: 100%; border-style: dashed;"><i class="fas fa-plus"></i> Add More Video</button>
        </div>
    </div>

    <div class="save-bar">
        <button class="btn btn-preview">Preview Site</button>
        <button class="btn btn-save">Save Changes</button>
    </div>

</body>
</html>
